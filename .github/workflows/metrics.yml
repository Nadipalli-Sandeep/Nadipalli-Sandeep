name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # runs every day at 2 AM UTC
  workflow_dispatch:        # run manually from Actions tab anytime

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      # ── 1. General stats card ──────────────────────────────────────
      - name: Generate general stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/general.svg
          base: header, activity, community, repositories
          plugin_lines: yes
          plugin_traffic: yes
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_padding: 8
          output_action: commit
          committer_message: "chore: update metrics [skip ci]"

      # ── 2. Top languages card ──────────────────────────────────────
      - name: Generate languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 14
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          output_action: commit
          committer_message: "chore: update language metrics [skip ci]"

      # ── 3. Habits / activity card ──────────────────────────────────
      - name: Generate habits card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics/habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          output_action: commit
          committer_message: "chore: update habits metrics [skip ci]"
