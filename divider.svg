<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40">
  <rect width="900" height="40" fill="#000000"/>
  <!-- Base line -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="#00ff88" stroke-width="0.5" opacity="0.3"/>
  <!-- Animated scanner -->
  <rect y="0" width="180" height="40" opacity="0.06">
    <defs>
      <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"  stop-color="#00ff88" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
        <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <animateTransform attributeName="transform" type="translate" from="-180,0" to="900,0" dur="3s" repeatCount="indefinite"/>
    <set attributeName="fill" to="url(#scan)"/>
  </rect>
  <!-- Data packets -->
  <g font-family="monospace" font-size="8" fill="#00ff88" opacity="0.5">
    <text y="16"><animate attributeName="x" values="-100;1000" dur="4s" repeatCount="indefinite" begin="0s"/>01101000</text>
    <text y="28"><animate attributeName="x" values="-100;1000" dur="3s" repeatCount="indefinite" begin="1.5s"/>10010110</text>
  </g>
  <!-- Diamond center -->
  <polygon points="450,10 460,20 450,30 440,20" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="450,15 455,20 450,25 445,20" fill="#00ff88" opacity="0.4"/>
</svg>
