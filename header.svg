<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#050b1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGrad)"/>

  <!-- Scanlines overlay -->
  <rect width="900" height="280" fill="url(#scan)" opacity="0.04"/>

  <!-- Grid lines -->
  <g opacity="0.07" stroke="#00ff88" stroke-width="0.5">
    <line x1="0" y1="56"  x2="900" y2="56"/>
    <line x1="0" y1="112" x2="900" y2="112"/>
    <line x1="0" y1="168" x2="900" y2="168"/>
    <line x1="0" y1="224" x2="900" y2="224"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
  </g>

  <!-- Animated neural network nodes + edges -->
  <!-- Edges (drawn first, behind nodes) -->
  <g opacity="0.25" stroke="#00ff88" stroke-width="0.8">
    <line x1="60"  y1="60"  x2="180" y2="130"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="180" y1="130" x2="300" y2="80"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="300" y1="80"  x2="420" y2="150"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="420" y1="150" x2="580" y2="60"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/></line>
    <line x1="580" y1="60"  x2="700" y2="120"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="700" y1="120" x2="840" y2="50"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="60"  y1="60"  x2="300" y2="80"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/></line>
    <line x1="180" y1="130" x2="420" y2="150"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="420" y1="150" x2="700" y2="120"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/></line>
    <line x1="60"  y1="220" x2="180" y2="130"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="180" y1="130" x2="300" y2="220"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="300" y1="220" x2="420" y2="150"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="420" y1="150" x2="580" y2="230"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/></line>
    <line x1="580" y1="230" x2="700" y2="120"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="700" y1="120" x2="840" y2="200"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- Signal pulses travelling along edges -->
  <circle r="3" fill="#00ffcc" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M60,60 L840,50"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#00b4d8" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M840,200 L60,220"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#7c3aed" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M60,60 L180,130 L300,80 L420,150 L580,60 L700,120 L840,50"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#00ff88" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M840,200 L700,120 L580,230 L420,150 L300,220 L180,130 L60,220"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Neural network nodes -->
  <g filter="url(#glow)">
    <!-- Node 1 -->
    <circle cx="60"  cy="60"  r="6" fill="none" stroke="#00ff88" stroke-width="1.5"><animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="60"  r="2.5" fill="#00ff88"/>
    <!-- Node 2 -->
    <circle cx="180" cy="130" r="7" fill="none" stroke="#00b4d8" stroke-width="1.5"><animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="130" r="3" fill="#00b4d8"/>
    <!-- Node 3 -->
    <circle cx="300" cy="80"  r="5" fill="none" stroke="#7c3aed" stroke-width="1.5"><animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="80"  r="2" fill="#7c3aed"/>
    <!-- Node 4 (center) -->
    <circle cx="420" cy="150" r="9" fill="none" stroke="#00ff88" stroke-width="2"><animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="150" r="4" fill="#00ff88"/>
    <!-- Node 5 -->
    <circle cx="580" cy="60"  r="6" fill="none" stroke="#00b4d8" stroke-width="1.5"><animate attributeName="r" values="5;9;5" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="60"  r="2.5" fill="#00b4d8"/>
    <!-- Node 6 -->
    <circle cx="700" cy="120" r="7" fill="none" stroke="#00ff88" stroke-width="1.5"><animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="3" fill="#00ff88"/>
    <!-- Node 7 -->
    <circle cx="840" cy="50"  r="5" fill="none" stroke="#7c3aed" stroke-width="1.5"><animate attributeName="r" values="4;7;4" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="50"  r="2" fill="#7c3aed"/>
    <!-- Bottom nodes -->
    <circle cx="60"  cy="220" r="4" fill="none" stroke="#00b4d8" stroke-width="1"><animate attributeName="r" values="3;6;3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="220" r="1.5" fill="#00b4d8"/>
    <circle cx="300" cy="220" r="5" fill="none" stroke="#00ff88" stroke-width="1"><animate attributeName="r" values="4;8;4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="220" r="2" fill="#00ff88"/>
    <circle cx="580" cy="230" r="4" fill="none" stroke="#7c3aed" stroke-width="1"><animate attributeName="r" values="3;6;3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="230" r="1.5" fill="#7c3aed"/>
    <circle cx="840" cy="200" r="5" fill="none" stroke="#00b4d8" stroke-width="1"><animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="200" r="2" fill="#00b4d8"/>
  </g>

  <!-- Floating binary bits -->
  <g font-family="monospace" font-size="9" fill="#00ff88" opacity="0.18">
    <text x="20"  y="170"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.1s" repeatCount="indefinite"/>10110</text>
    <text x="800" y="170"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.3s" repeatCount="indefinite"/>01001</text>
    <text x="20"  y="250"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s"   repeatCount="indefinite"/>11001</text>
    <text x="800" y="250"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="2.7s" repeatCount="indefinite"/>10100</text>
  </g>

  <!-- ===== MAIN TITLE — glitch layers ===== -->
  <!-- Shadow/glitch layer 1 (cyan offset) -->
  <text x="451" y="155" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="62" font-weight="900" letter-spacing="6"
        fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.5">
    JAYA SANDEEP
    <animate attributeName="x" values="451;455;449;451;451" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5;0.8;0.5" dur="6s" repeatCount="indefinite"/>
  </text>
  <!-- Shadow/glitch layer 2 (magenta offset) -->
  <text x="449" y="157" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="62" font-weight="900" letter-spacing="6"
        fill="none" stroke="#ff00aa" stroke-width="0.8" opacity="0.3">
    JAYA SANDEEP
    <animate attributeName="x" values="449;445;452;449;449" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.6;0.1;0.3;0.3" dur="7s" repeatCount="indefinite"/>
  </text>
  <!-- Main title -->
  <text x="450" y="156" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="62" font-weight="900" letter-spacing="6" filter="url(#glowStrong)">
    <defs>
      <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#00ff88"><animate attributeName="stop-color" values="#00ff88;#00b4d8;#7c3aed;#00ff88" dur="4s" repeatCount="indefinite"/></stop>
        <stop offset="50%"  stop-color="#00b4d8"><animate attributeName="stop-color" values="#00b4d8;#7c3aed;#00ff88;#00b4d8" dur="4s" repeatCount="indefinite"/></stop>
        <stop offset="100%" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#00ff88;#00b4d8;#7c3aed" dur="4s" repeatCount="indefinite"/></stop>
      </linearGradient>
    </defs>
    <tspan fill="url(#titleGrad)">JAYA SANDEEP</tspan>
  </text>

  <!-- Subtitle -->
  <text x="450" y="190" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="14" letter-spacing="4" fill="#00b4d8" opacity="0.9" filter="url(#glow)">
    AI &amp; ML ENGINEER  ·  LLM BUILDER  ·  AGENTIC AI EXPLORER
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Blinking cursor line -->
  <rect x="390" y="200" width="120" height="1.5" fill="#00ff88" opacity="0.4">
    <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <g stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.5">
    <polyline points="8,30 8,8 30,8"/>
    <polyline points="870,8 892,8 892,30"/>
    <polyline points="8,250 8,272 30,272"/>
    <polyline points="870,272 892,272 892,250"/>
  </g>

  <!-- Small labels -->
  <text x="15" y="275" font-family="monospace" font-size="8" fill="#00ff88" opacity="0.4">v2.0.25</text>
  <text x="760" y="275" font-family="monospace" font-size="8" fill="#00ff88" opacity="0.4">NEURAL ACTIVE</text>
  <circle cx="850" cy="271" r="3" fill="#00ff88"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></circle>
</svg>
